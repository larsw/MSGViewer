[package]
name = "msg-viewer"
version = "0.1.0"
description = "Read Microsoft Outlook .msg files"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
outlook-msg = { path = "../outlook-msg" }

[lints.rust]
unsafe_code = "forbid"
