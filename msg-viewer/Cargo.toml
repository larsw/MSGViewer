[package]
name = "msg-viewer"
version = "0.1.0"
description = "Read Microsoft Outlook .msg files"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Distributed only as a Flatpak (ADR-0005), never on crates.io.
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_18"] }
outlook-msg = { path = "../outlook-msg" }
webkit6 = { version = "0.6.1", features = ["v2_42"] }

[dev-dependencies]
# Builds small `.msg` files for tests, as the parser's own tests do.
cfb = "0.15.0"

[lints.rust]
unsafe_code = "forbid"
