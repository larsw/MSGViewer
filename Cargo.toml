[workspace]
members = ["outlook-msg", "msg-viewer"]
# The fuzz crate needs a nightly toolchain; see AGENTS.md.
exclude = ["outlook-msg/fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/larsw/MSGViewer"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1
